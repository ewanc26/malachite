version: 2
# Dependabot version-update config for malachite.
#
# A 7-day cooldown lets newly published releases age so compromised
# versions are usually yanked before we adopt them. Security updates
# are never delayed. Auto-merge is intentionally disabled.

updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/tid"
      - "/web"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
